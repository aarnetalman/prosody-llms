# Model registry: every model used in the experiments, pinned to an exact Hugging Face
# revision (commit hash), checked against the Hub on 2026-11-13. Every model here fits
# one GPU with about 95 GB of memory in bfloat16.
#
#   kind        encoder | decoder | speech | speech_text
#   checkpoint  base | post_trained   (post_trained = instruction- or chat-tuned; only used
#               where no base checkpoint exists, or as an explicit contrast)
#   status      planned (used in the paper) | proposed | dropped (not used)
#
# The hosted models used for prompting (GPT-4o, DeepSeek-V4-Pro, Mistral Large 3, GPT-5.5)
# are configured in configs/prompting.toml.
#
# params: parameter count at the pinned revision, from the Hugging Face API (safetensors
# metadata, 2026-11-16); for WavLM-large and HuBERT-large, which have only a float32
# pytorch_model.bin, the file size divided by 4. Whisper and Qwen2-Audio: whole model.

